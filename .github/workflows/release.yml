name: 打包发布

# 触发方式：
#   1. 推送 tag（如 v0.1.0）→ 构建三平台产物并创建 GitHub Release
#   2. 手动运行（Actions 页面）→ 只上传 artifacts，不创建 Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (.app / .dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 打包
        run: ./scripts/package-macos.sh --dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/GuessingGame.dmg
          if-no-files-found: error

  windows:
    name: Windows (zip / setup.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: 打包
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Zip -Installer

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-setup.exe
            dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux (tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libx11-dev libxcb1-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev

      - name: 打包
        run: ./scripts/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: 创建 Release
    # 只在 tag 推送时执行，workflow_dispatch 只留 artifacts
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
